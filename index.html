<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple task manager with LocalStorage">
  <title>TaskFlow | To-Do List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a class="brand" href="#"><span class="brand-icon">✓</span> TaskFlow</a>
      <span class="today" id="today"></span>
    </header>

    <section class="welcome">
      <p class="eyebrow">YOUR PERSONAL TASK MANAGER</p>
      <h1>Make today <span>count.</span></h1>
      <p class="subtitle">A little progress each day adds up to big results.</p>
    </section>

    <section class="task-panel" aria-label="Task manager">
      <form id="taskForm" class="task-form">
        <label class="sr-only" for="taskInput">Enter a new task</label>
        <input id="taskInput" type="text" maxlength="120" placeholder="What do you need to get done?" autocomplete="off" required>
        <button class="add-button" type="submit">+ Add task</button>
      </form>

      <div class="summary">
        <div><strong id="totalCount">0</strong><span>Total tasks</span></div>
        <div><strong id="activeCount">0</strong><span>Remaining</span></div>
        <div><strong id="completedCount">0</strong><span>Completed</span></div>
      </div>

      <div class="list-heading">
        <h2>Your tasks</h2>
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter active" data-filter="all" type="button">All</button>
          <button class="filter" data-filter="active" type="button">Active</button>
          <button class="filter" data-filter="completed" type="button">Completed</button>
        </div>
      </div>

      <ul id="taskList" class="task-list" aria-live="polite"></ul>
      <p id="emptyMessage" class="empty-message">No tasks here yet. Add one to get started!</p>
      <div class="panel-footer">
        <span id="progressText">0% completed</span>
        <button id="clearCompleted" class="clear-button" type="button">Clear completed</button>
      </div>
      <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
    </section>

    <footer>Stay focused. Keep moving forward. <span>✦</span></footer>
  </main>
</body>
</html>
